[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "explainability"
version = "0.1.0"
description = "GAE lesion saliency maps for BanffNET, integrated with the WSI pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
authors = [{name="Giorgio Buzzanca", email="g.buzzanca@lumc.nl"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "banffnet>=0.1.0",
    "binarization>=0.1.0",
    "click>=8.3.3",
    "features-extraction>=0.1.0",
    "h5py>=3.16.0",
    "numpy>=1.22",
    "opencv-python>=4.13.0.92",
    "openslide-python>=1.4.3",
    "pillow>=10.0",
    "pyyaml>=6.0.3",
    "timm>=1.0.27",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "wsipatch>=0.1.0",
]

[project.scripts]
run-explainability = "explainability.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/explainability"]

[tool.uv.sources]
wsipatch            = { workspace = true }
binarization        = { workspace = true }
features-extraction = { workspace = true }
banffnet            = { workspace = true }
