[project]
name = "banffnet-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["banffnet", "binarization", "explainability", "features_extraction", "wsipatch"]

[tool.uv.sources]
wsipatch             = { workspace = true }
binarization         = { workspace = true }
features-extraction  = { workspace = true }
banffnet             = { workspace = true }
explainability       = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff"]

[tool.pytest.ini_options]
markers = [
    "gpu: requires CUDA-capable GPU (deselect with -m 'not gpu')",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
